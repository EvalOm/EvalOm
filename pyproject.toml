[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "evalom"
version = "0.3.0"
description = "Open-source evaluation platform for LLM and RAG applications"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "EvalOm" }
]
license = { text = "MIT" }
dependencies = [
  "PyYAML>=6.0",
  "fastapi>=0.115,<1.0",
  "uvicorn>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27",
  "pytest>=8.0",
]
postgres = [
  "psycopg[binary]>=3.2",
]

[project.scripts]
evalom = "evalom.cli:main"
aieval = "evalom.cli:main"
evalom-api = "evalom.api:run"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
